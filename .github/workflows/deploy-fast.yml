name: Fast Deploy (build + critical paths only)

# Manuel tetiklenir. Full workflow lftp mirror'da takıldığında bunu çalıştır.
# Sadece public/build, bootstrap/ssr, app, resources, routes, config, database, composer.* dosyalarını
# her birini ayrı küçük bir lftp mirror oturumunda yükler. Tek dosyada takılsa diğerleri etkilenmez.

on:
  workflow_dispatch:

concurrency:
  group: deploy-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-deploy:
    name: ⚡ Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Validate FTP secrets
        run: |
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              exit 1
            fi
          done
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 📦 Install Node deps
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build frontend assets
        run: npm run build

      - name: 📂 Sync critical paths (one mirror per path)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp -q 2>&1 | tail -3

          PATHS=(
            "public/build"
            "bootstrap/ssr"
            "app"
            "resources/views"
            "resources/js"
            "resources/css"
            "routes"
            "config"
            "database/migrations"
            "database/seeders"
          )

          FILES=(
            "composer.json"
            "composer.lock"
            "package.json"
            "package-lock.json"
            "artisan"
          )

          for path in "${PATHS[@]}"; do
            echo ""
            echo "▶ ${path}/ → public_html/${path}/"
            lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftps://${FTP_SERVER}" << LFTPEOF
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ssl:verify-certificate false
          set net:timeout 180
          set net:max-retries 30
          set net:reconnect-interval-base 8
          set net:reconnect-interval-multiplier 1.5
          set net:reconnect-interval-max 60
          set net:idle 30
          set ftp:ssl-protect-data true
          set mirror:parallel-directories false
          set xfer:clobber on
          mirror --reverse --delete --verbose=1 --parallel=1 --use-cache \
            ./${path} public_html/${path}
          bye
          LFTPEOF
          done

          echo ""
          echo "▶ Top-level files"
          for file in "${FILES[@]}"; do
            echo "  · ${file}"
            lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftps://${FTP_SERVER}" -e "
              set ftp:passive-mode true;
              set ftp:ssl-force true;
              set ssl:verify-certificate false;
              set net:timeout 60;
              set net:max-retries 10;
              put ${file} -o public_html/${file};
              bye
            " || echo "  ⚠ ${file} skipped"
          done

      - name: ✅ Done
        run: |
          echo "Fast deploy finished."
          echo "Manuel SSH yoksa cache temizliği için: https://benizledim.com/__cache_clear (varsa) veya cPanel terminal."
