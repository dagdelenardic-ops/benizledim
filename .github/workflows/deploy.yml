name: Deploy Laravel to cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_APP_PATH: ${{ secrets.SSH_APP_PATH }}
      DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔐 Validate required secrets
        run: |
          missing=0
          for key in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: 📦 Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-ansi --ignore-platform-reqs

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 📦 Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build frontend assets
        run: npm run build

      - name: 🧹 Purge exposed debug endpoints
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          files=(
            _diag.php
            _probe.php
            _probe.txt
            check_config.php
            check_db.php
            check_mb.php
            check_sessions.php
            chmod_storage.php
            db_users.php
            debug_laravel.php
            extract.php
            get_admin.php
            list_users.php
            mkdir_views.php
            read_env.php
            read_log.php
            read_pct.php
            reset_admin.php
            reset_gurur.php
            run_artisan.php
            run_cli.php
            save_hash.php
            test_auth.php
            test_hash.php
            unzip.php
            unzip_sys.php
            update_pass.php
          )

          for file in "${files[@]}"; do
            for dir in public_html public_html/public; do
              echo "Attempting delete: ${dir}/${file}"
              curl --silent --show-error --ftp-method nocwd \
                --connect-timeout 6 \
                --max-time 12 \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                --url "ftp://${FTP_SERVER}/${dir}/" \
                --quote "DELE ${file}" >/dev/null || true
            done
          done

      - name: 📂 Sync files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp -q 2>&1 | tail -3

          cat > /tmp/lftp-exclude.txt << 'EXCEOF'
          ^\.git
          ^\.github
          ^node_modules
          ^tests
          ^database/data/.*\.sqlite$
          ^\.env$
          ^\.env\.
          \.env\.example$
          \.env\.production$
          \.env\.cpanel$
          ^CLAUDE\.md$
          ^AGENTS\.md$
          ^\.codex-instructions\.md$
          ^\.kimi-instructions\.md$
          ^\.qwen-instructions\.md$
          ^\.claude/
          ^\.DS_Store$
          _diag\.php$
          _probe\.php$
          _probe\.txt$
          read_env\.php$
          check_config\.php$
          check_db\.php$
          check_mb\.php$
          check_sessions\.php$
          chmod_storage\.php$
          db_users\.php$
          debug_laravel\.php$
          debug_.*\.txt$
          extract\.php$
          get_admin\.php$
          list_users\.php$
          mkdir_views\.php$
          read_log\.php$
          read_pct\.php$
          reset_admin\.php$
          reset_gurur\.php$
          run_artisan\.php$
          run_cli\.php$
          save_hash\.php$
          setup.*\.php$
          seed_and_import\.php$
          test_auth\.php$
          test_hash\.php$
          unzip\.php$
          unzip_sys\.php$
          update_pass\.php$
          \.zip$
          EXCEOF

          lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftps://${FTP_SERVER}" << 'LFTPEOF'
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ssl:verify-certificate false
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 2
          set mirror:parallel-directories true
          mirror --reverse --delete --verbose=1 --parallel=4 \
            --exclude-rx-from=/tmp/lftp-exclude.txt \
            . public_html/
          bye
          LFTPEOF

      - name: 🔧 Post-deploy optimize (optional SSH)
        if: ${{ env.SSH_HOST != '' && env.SSH_USERNAME != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          passphrase: ${{ env.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            APP_PATH="$SSH_APP_PATH"
            if [ -z "$APP_PATH" ]; then
              APP_PATH="$HOME/public_html"
            fi
            cd "$APP_PATH"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan view:cache
            php artisan event:cache

      - name: 🩺 Health check (optional)
        if: ${{ env.DEPLOY_HEALTHCHECK_URL != '' }}
        run: |
          for i in {1..15}; do
            http_code="$(curl -sS -o /tmp/deploy-health.txt -w '%{http_code}' "$DEPLOY_HEALTHCHECK_URL" || true)"
            if [ "$http_code" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt ${i}/15 failed with status ${http_code}."
            sleep 10
          done
          echo "::error::Health check failed after deployment."
          cat /tmp/deploy-health.txt || true
          exit 1
