<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dc2626">
    <title>Çevrimdışı - Ben/İzledim</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #171717;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: bold;
            color: #171717;
            margin-bottom: 1.5rem;
        }
        .logo span { color: #dc2626; padding: 0 0.15em; }
        .icon {
            width: 64px; height: 64px;
            margin-bottom: 1.5rem;
            color: #dc2626;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.9rem;
            color: #6b7280;
            max-width: 28ch;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        button {
            background: #dc2626;
            color: #fff;
            border: 2px solid #171717;
            padding: 0.75rem 2rem;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        button:active { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="logo">Ben<span>/</span>İzledim</div>
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M18.364 5.636a9 9 0 11-12.728 0M12 9v4m0 4h.01"/>
    </svg>
    <h1>Çevrimdışısın</h1>
    <p>İnternet bağlantın kesilmiş görünüyor. Bağlantın gelince tekrar dene.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
</body>
</html>
